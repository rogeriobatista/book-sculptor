<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" fill="none" aria-hidden="true">
  <defs>
    <linearGradient id="paper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141a17"/>
      <stop offset="45%" stop-color="#101512"/>
      <stop offset="100%" stop-color="#0a0e0c"/>
    </linearGradient>
    <linearGradient id="ink-wash" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#45b896" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#45b896" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="page-left" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e2622"/>
      <stop offset="100%" stop-color="#161c19"/>
    </linearGradient>
    <linearGradient id="page-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c2420"/>
      <stop offset="100%" stop-color="#141a17"/>
    </linearGradient>
    <linearGradient id="spine-shadow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#45b896" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#45b896" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.06"/>
      </feComponentTransfer>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#paper)"/>

  <ellipse cx="180" cy="620" rx="280" ry="200" fill="url(#ink-wash)" filter="url(#soft)"/>
  <ellipse cx="1420" cy="180" rx="320" ry="240" fill="url(#ink-wash)" filter="url(#soft)"/>
  <ellipse cx="820" cy="820" rx="420" ry="120" fill="#45b896" fill-opacity="0.08" filter="url(#soft)"/>

  <path d="M800 720 C620 680 420 640 120 610 C120 420 120 230 120 140 C420 170 620 210 800 250 Z" fill="url(#page-left)" stroke="#2a3530" stroke-width="1.2"/>
  <path d="M800 720 C980 680 1180 640 1480 610 C1480 420 1480 230 1480 140 C1180 170 980 210 800 250 Z" fill="url(#page-right)" stroke="#2a3530" stroke-width="1.2"/>

  <path d="M800 250 L800 720" stroke="url(#spine-shadow)" stroke-width="6"/>
  <path d="M800 250 C800 410 800 560 800 720" stroke="#45b896" stroke-opacity="0.15" stroke-width="1"/>

  <g stroke="#45b896" stroke-opacity="0.1" stroke-width="1">
    <line x1="200" y1="320" x2="720" y2="350"/>
    <line x1="180" y1="360" x2="730" y2="390"/>
    <line x1="165" y1="400" x2="735" y2="430"/>
    <line x1="155" y1="440" x2="740" y2="470"/>
    <line x1="145" y1="480" x2="745" y2="510"/>
    <line x1="138" y1="520" x2="748" y2="550"/>
    <line x1="132" y1="560" x2="752" y2="590"/>
  </g>

  <g stroke="#45b896" stroke-opacity="0.1" stroke-width="1">
    <line x1="880" y1="350" x2="1400" y2="320"/>
    <line x1="870" y1="390" x2="1410" y2="360"/>
    <line x1="865" y1="430" x2="1415" y2="400"/>
    <line x1="860" y1="470" x2="1420" y2="440"/>
    <line x1="855" y1="510" x2="1425" y2="480"/>
    <line x1="852" y1="550" x2="1428" y2="520"/>
    <line x1="848" y1="590" x2="1432" y2="560"/>
  </g>

  <g opacity="0.45">
    <rect x="1080" y="90" width="140" height="180" rx="4" transform="rotate(12 1080 90)" fill="#1e2622" stroke="#2a3530" stroke-width="1"/>
    <rect x="1120" y="110" width="140" height="180" rx="4" transform="rotate(18 1120 110)" fill="#1a221e" stroke="#2a3530" stroke-width="1"/>
    <rect x="340" y="120" width="130" height="170" rx="4" transform="rotate(-14 340 120)" fill="#1e2622" stroke="#2a3530" stroke-width="1"/>
  </g>

  <g transform="translate(1260 420) rotate(24)" opacity="0.4">
    <path d="M0 0 C30 -40 70 -60 110 -50 C80 -10 40 30 0 80 C-10 40 -5 10 0 0 Z" fill="#45b896"/>
    <path d="M0 80 L0 200" stroke="#45b896" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M-8 200 C0 220 8 220 0 200" fill="#45b896"/>
  </g>

  <path d="M260 380 C260 340 290 310 310 280 C330 310 360 340 360 380 C360 420 310 450 310 450 C310 450 260 420 260 380 Z" fill="#45b896" fill-opacity="0.14"/>

  <text x="220" y="260" font-family="Georgia, 'Times New Roman', serif" font-size="120" fill="#45b896" fill-opacity="0.07">A</text>
  <text x="1280" y="300" font-family="Georgia, 'Times New Roman', serif" font-size="96" fill="#45b896" fill-opacity="0.06">§</text>
  <text x="720" y="180" font-family="Georgia, 'Times New Roman', serif" font-size="72" fill="#45b896" fill-opacity="0.05">Chapter</text>

  <radialGradient id="vignette" cx="50%" cy="45%" r="65%">
    <stop offset="55%" stop-color="#000" stop-opacity="0"/>
    <stop offset="100%" stop-color="#000" stop-opacity="0.35"/>
  </radialGradient>
  <rect width="1600" height="900" fill="url(#vignette)"/>

  <rect width="1600" height="900" filter="url(#grain)" opacity="0.55"/>
</svg>
